aid: deepnight
name: Deepnight
description: 'Deepnight is a San Francisco defense-technology company building AI-powered digital
  night vision. It embeds edge AI models into commoditized digital (CMOS) image sensors, using a deep
  neural network that aggregates photons temporally to recover true information in near-total darkness
  — down to overcast moonless starlight (0.1 millilux) — exceeding the performance of conventional Gen 3
  analog image-intensifier tubes at a fraction of the cost. By using mass-manufactured consumer-electronics
  sensors, Deepnight aims to turn night vision from a scarce defense capability into a scalable digital
  product for people, robots, drones, and autonomous vehicles. Founded by former Google engineers Lucas
  Young and Thomas Li, the company is backed by Initialized Capital and has won U.S. Army and Air Force
  contracts. Deepnight publishes no public developer API; this profile tracks its web and security surface.'
